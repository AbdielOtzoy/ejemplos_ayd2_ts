server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /health { default_type text/plain; return 200 "ok\n"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = / { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=3600"; }
    location = /styles.css { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }
}
