# Versión 1: todo en un solo playbook. Funciona, pero no se puede reutilizar.
- hosts: web
  become: true
  tasks:
    - name: Instalar nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Publicar la web
      ansible.builtin.copy:
        content: "{{ lookup('file', '../../cloud-clase-1/web/v1/index.html') | replace('AMBIENTE_DEMO', group_names | first) }}"
        dest: /var/www/html/index.html
